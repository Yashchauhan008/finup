name: Build FinUp

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Icon tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin zip

      - name: Fixed signing key (updates keep your data)
        run: |
          if [ ! -f keys/debug.keystore ]; then
            mkdir -p keys
            keytool -genkeypair -v -keystore keys/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=FinUp,O=FinUp,C=IN"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add keys/debug.keystore
            git commit -m "Add fixed signing key [skip ci]"
            git push
          fi
          mkdir -p ~/.android
          cp keys/debug.keystore ~/.android/debug.keystore
          if [ -n "${ANDROID_USER_HOME:-}" ]; then
            mkdir -p "$ANDROID_USER_HOME"
            cp keys/debug.keystore "$ANDROID_USER_HOME/debug.keystore"
          fi

      - name: Generate app source
        run: |
          bash finup.sh
          for s in finup2.sh finup3.sh finup4.sh; do
            if [ -f "$s" ]; then bash "$s"; fi
          done

      - name: Create Android project, icons, build APK
        working-directory: app
        run: |
          flutter create --project-name finup --org com.yash --platforms android .
          rm -rf test
          if [ -f branding/make_icons.sh ]; then bash branding/make_icons.sh; fi
          flutter pub get
          flutter build apk --release

      - name: Package APK and source zip
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk FinUp.apk
          cd app
          zip -r ../FinUp-source.zip . -x 'build/*' '.dart_tool/*' '.idea/*' '*.iml' 'android/.gradle/*' 'android/local.properties'
          cd ..

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FinUp build ${{ github.run_number }}
          files: |
            FinUp.apk
            FinUp-source.zip