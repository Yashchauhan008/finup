name: Build FinUp

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What's new (shown inside the app)"
        required: false
        default: "Improvements and fixes"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Icon tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin zip

      - name: Fixed signing key (same key for every build)
        run: |
          if [ ! -f keys/debug.keystore ]; then
            mkdir -p keys
            keytool -genkeypair -v -keystore keys/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=FinUp,O=FinUp,C=IN"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add keys/debug.keystore
            git commit -m "Add fixed signing key [skip ci]"
            git push
          fi
          mkdir -p ~/.android
          cp keys/debug.keystore ~/.android/debug.keystore

      - name: Generate app source
        run: |
          bash finup.sh
          for n in 2 3 4 5 6 7 8 9 10; do
            if [ -f "finup$n.sh" ]; then bash "finup$n.sh"; fi
          done

      - name: Create Android project, icons, signing, build APK
        working-directory: app
        env:
          FINUP_KEYSTORE: ${{ github.workspace }}/keys/debug.keystore
        run: |
          flutter create --project-name finup --org com.yash --platforms android .
          rm -rf test
          if [ -f branding/make_icons.sh ]; then bash branding/make_icons.sh; fi
          python3 - <<'PY'
          import os, pathlib
          ks = os.environ["FINUP_KEYSTORE"]
          kts = pathlib.Path("android/app/build.gradle.kts")
          groovy = pathlib.Path("android/app/build.gradle")
          if kts.exists():
              s = kts.read_text()
              block = ('    signingConfigs {\n'
                       '        create("finup") {\n'
                       f'            storeFile = file("{ks}")\n'
                       '            storePassword = "android"\n'
                       '            keyAlias = "androiddebugkey"\n'
                       '            keyPassword = "android"\n'
                       '        }\n'
                       '    }\n\n')
              if 'create("finup")' not in s:
                  s = s.replace("    buildTypes {", block + "    buildTypes {", 1)
              s = s.replace('signingConfigs.getByName("debug")', 'signingConfigs.getByName("finup")')
              kts.write_text(s)
              ok = 'getByName("finup")' in s and 'create("finup")' in s
          elif groovy.exists():
              s = groovy.read_text()
              block = ("    signingConfigs {\n"
                       "        finup {\n"
                       f"            storeFile file('{ks}')\n"
                       "            storePassword 'android'\n"
                       "            keyAlias 'androiddebugkey'\n"
                       "            keyPassword 'android'\n"
                       "        }\n"
                       "    }\n\n")
              if "        finup {" not in s:
                  s = s.replace("    buildTypes {", block + "    buildTypes {", 1)
              s = s.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.finup")
              groovy.write_text(s)
              ok = "signingConfigs.finup" in s
          else:
              raise SystemExit("No android/app/build.gradle(.kts) found")
          if not ok:
              raise SystemExit("Could not apply FinUp signing config")
          print("FinUp signing config applied with", ks)
          PY
          flutter pub get
          flutter build apk --release --build-number=${{ github.run_number }} --build-name=2.1.${{ github.run_number }}

      - name: Show signing fingerprint (must be the same every build)
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs app/build/app/outputs/flutter-apk/app-release.apk | grep -i "SHA-256" || true
          fi
          keytool -list -v -keystore keys/debug.keystore -storepass android | grep -i "SHA256" || true

      - name: Package APK and source zip
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk FinUp.apk
          cd app
          zip -r ../FinUp-source.zip . -x 'build/*' '.dart_tool/*' '.idea/*' '*.iml' 'android/.gradle/*' 'android/local.properties'
          cd ..

      - name: Publish private release (APK + source)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FinUp build ${{ github.run_number }}
          body: ${{ inputs.notes }}
          files: |
            FinUp.apk
            FinUp-source.zip

      - name: Publish APK to public updates repo
        if: env.RELEASES_TOKEN != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: Yashchauhan008/finup-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: build-${{ github.run_number }}
          name: FinUp 2.1.${{ github.run_number }}
          body: ${{ inputs.notes }}
          files: FinUp.apk